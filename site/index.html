<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>動画ランキングJP</title>
<meta name="description" content="日本で人気のYouTube動画（ショート除く）とライブ配信の急上昇・デイリー・ウィークリーランキング">
<meta property="og:type" content="website">
<meta property="og:site_name" content="動画ランキングJP">
<meta property="og:title" content="動画ランキングJP｜日本のYouTube急上昇・人気ランキング（非公式）">
<meta property="og:description" content="ショート除外。動画とライブを分けて、急上昇・デイリー・ウィークリーを2時間ごとに更新。完全無料。">
<meta property="og:url" content="https://tunakan12.github.io/yt-jp-ranking/">
<meta property="og:image" content="https://tunakan12.github.io/yt-jp-ranking/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="動画ランキングJP｜日本のYouTube急上昇・人気ランキング（非公式）">
<meta name="twitter:description" content="ショート除外。動画とライブを分けて、急上昇・デイリー・ウィークリーを2時間ごとに更新。完全無料。">
<meta name="twitter:image" content="https://tunakan12.github.io/yt-jp-ranking/ogp.png">
<script data-goatcounter="https://yuya.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
:root{
  --bg:#f6f6f4;--card:#fff;--ink:#16161a;--sub:#6b6b73;--line:#e4e4e0;
  --accent:#e0262b;--up:#1a8f4c;--down:#c2410c;--chip:#ececE8;--live:#e0262b;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111113;--card:#1b1b1f;--ink:#f1f1f3;--sub:#9a9aa3;--line:#2a2a30;
  --accent:#ff4d52;--up:#4ade80;--down:#fb923c;--chip:#26262b;--live:#ff4d52;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  -webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:12px 0 6px;flex-wrap:wrap}
h1{font-size:18px;margin:0;letter-spacing:.02em;white-space:nowrap}
h1 b{color:var(--accent)}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--sub);font:inherit;font-size:13px;font-weight:700;
  padding:5px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
#updated{font-size:12px;color:var(--sub);margin-left:auto;white-space:nowrap}
nav.tabs{display:flex;gap:4px}
nav.tabs button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-weight:600;
  font-size:15px;padding:10px 0;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;border-radius:999px;background:var(--chip);color:var(--ink);
  font:inherit;font-size:13px;padding:6px 12px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
#desc{font-size:12px;color:var(--sub);margin:14px 0 6px}
ol{list-style:none;margin:0;padding:0 0 40px}
li a{display:grid;grid-template-columns:36px 168px 1fr;gap:12px;align-items:start;
  padding:10px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
li a:hover .title{text-decoration:underline}
.rank{text-align:center;padding-top:4px}
.rank .n{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
li:nth-child(-n+3) .rank .n{color:var(--accent)}
.mv{font-size:11px;font-weight:700;display:block;margin-top:2px}
.mv.up{color:var(--up)}.mv.down{color:var(--down)}.mv.new{color:var(--accent)}.mv.same{color:var(--sub)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--chip)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .dur{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.8);color:#fff;
  font-size:11px;font-weight:600;padding:1px 4px;border-radius:4px;font-variant-numeric:tabular-nums}
.thumb .dur.live{background:var(--live)}
.title{font-size:15px;font-weight:600;line-height:1.4;margin:0 0 4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--sub);line-height:1.6}
.stat{font-size:13px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .est{font-weight:400;color:var(--sub);font-size:11px}
.cat{display:inline-block;font-size:11px;background:var(--chip);border-radius:4px;padding:0 6px;margin-right:6px}
footer{font-size:11px;color:var(--sub);text-align:center;padding:24px 16px 40px;line-height:1.8}
footer a{color:inherit}
.empty{color:var(--sub);text-align:center;padding:60px 0}
.seg.sm button{font-size:12px;padding:4px 10px}
.playlbl{font-size:12px;color:var(--sub);white-space:nowrap}
dialog#player{border:0;padding:0;width:min(960px,100%,calc((100vh - 140px) * 16 / 9));max-width:100%;background:var(--card);color:var(--ink);
  border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4)}
dialog#player::backdrop{background:rgba(0,0,0,.75)}
.pv{position:relative;aspect-ratio:16/9;background:#000}
.pv iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pinfo{display:flex;gap:12px;align-items:flex-start;padding:12px 16px 14px}
.pinfo .t{flex:1;min-width:0}
.pinfo .t p{margin:0 0 4px;font-weight:700;font-size:15px;line-height:1.4}
.pinfo .t span{font-size:12px;color:var(--sub)}
.pbtn{flex:none;border:0;border-radius:999px;background:var(--chip);color:var(--ink);font:inherit;font-size:13px;
  font-weight:700;padding:7px 14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.pbtn.yt{background:var(--accent);color:#fff}
@media (max-width:600px){dialog#player{border-radius:0;margin:auto 0}.pinfo{flex-wrap:wrap}.pinfo .t{flex-basis:100%}}
@media (max-width:600px){
  li a{grid-template-columns:28px 128px 1fr;gap:10px}
  .rank .n{font-size:17px}
  .title{font-size:14px}
  nav.tabs button{font-size:14px}
}
@media (max-width:400px){
  nav.tabs button{font-size:13px}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>動画ランキング<b>JP</b></h1>
      <div class="seg" id="kind">
        <button data-kind="video" aria-pressed="true">動画</button>
        <button data-kind="live" aria-pressed="false">ライブ</button>
      </div>
      <span class="playlbl">再生</span>
      <div class="seg sm" id="play">
        <button data-play="site" aria-pressed="true">サイト内</button>
        <button data-play="yt" aria-pressed="false">YouTube</button>
      </div>
      <span id="updated"></span>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main class="wrap">
  <p id="desc"></p>
  <ol id="list"></ol>
</main>
<dialog id="player" aria-label="動画プレーヤー">
  <div class="pv" id="pv"></div>
  <div class="pinfo">
    <div class="t"><p id="ptitle"></p><span id="pch"></span></div>
    <a class="pbtn yt" id="popen" target="_blank" rel="noopener">YouTubeで開く</a>
    <button class="pbtn" id="pclose">閉じる</button>
  </div>
</dialog>
<footer>
  動画はショートを除外。ライブは配信アーカイブと配信中の枠を集計しています。<br>
  動画情報と再生数は YouTube Data API（YouTube API Services）から取得しています。再生数の増加量・急上昇の順位は当サイト独自の集計で、YouTube公式のものではありません。<br>
  <a href="terms.html">利用規約</a> ・
  <a href="privacy.html">プライバシーポリシー</a> ・
  <a href="https://www.youtube.com/t/terms" target="_blank" rel="noopener">YouTube 利用規約</a> ・
  <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google プライバシーポリシー</a>
</footer>
<script>
const TABS = {
  video: [["trending", "急上昇"], ["daily", "デイリー"], ["weekly", "ウィークリー"]],
  live: [["now", "配信中"], ["trending", "急上昇"], ["daily", "デイリー"], ["weekly", "ウィークリー"]],
};
const DESC = {
  "video/trending": "投稿72時間以内の動画を、直近の再生ペースで順位付け",
  "video/daily": "直近24時間で再生数が増えた動画",
  "video/weekly": "直近7日間で再生数が増えた動画",
  "live/now": "いま配信中のライブを同時視聴者数の多い順に（集計時点）",
  "live/trending": "72時間以内に始まった配信のアーカイブを、直近の再生ペースで順位付け",
  "live/daily": "直近24時間で再生数が増えた配信アーカイブ",
  "live/weekly": "直近7日間で再生数が増えた配信アーカイブ",
};
let data = null, kind = "video", tab = "trending", cat = "すべて", play = "site";
try { if (localStorage.getItem("ytjp_play") === "yt") play = "yt"; } catch (e) {}

function readHash() {
  const [k, t] = location.hash.slice(1).split("/");
  if (TABS[k]) { kind = k; tab = TABS[k].some(x => x[0] === t) ? t : TABS[k][0][0]; return true; }
  return false;
}
if (!readHash()) {
  try { const s = JSON.parse(localStorage.getItem("ytjp2") || "{}"); if (TABS[s.kind]) { kind = s.kind; tab = s.tab || TABS[kind][0][0]; } } catch (e) {}
}

const man = n => n >= 1e8 ? (n / 1e8).toFixed(n >= 1e9 ? 0 : 1) + "億" : n >= 1e4 ? (n / 1e4).toFixed(n >= 1e6 ? 0 : 1) + "万" : n.toLocaleString("ja-JP");
const dur = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
const ago = t => { const h = (Date.now() / 1000 - t) / 3600; return h < 1 ? Math.max(1, Math.round(h * 60)) + "分前" : h < 24 ? Math.round(h) + "時間前" : Math.round(h / 24) + "日前"; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function save() {
  try { localStorage.setItem("ytjp2", JSON.stringify({ kind, tab })); } catch (e) {}
  history.replaceState(null, "", `#${kind}/${tab}`);
}

function move(x) {
  if (x.prev == null) return '<span class="mv new">NEW</span>';
  const d = x.prev - x.rank;
  return d > 0 ? `<span class="mv up">▲${d}</span>` : d < 0 ? `<span class="mv down">▼${-d}</span>` : '<span class="mv same">―</span>';
}

function stat(x) {
  if (tab === "now") return `👀 ${man(x.viewers)}人が視聴中`;
  if (tab === "trending") return `🔥 ${man(x.rate)}回/時${x.est ? ' <span class="est">（推定）</span>' : ""}`;
  const lbl = tab === "daily" ? "24時間" : "7日間";
  return `+${man(x.gain)}回 <span class="est">/ ${lbl}${x.est ? "（推定）" : ""}</span>`;
}

function meta(x) {
  if (tab === "now") return `${esc(x.ch)}<br>${x.start ? ago(x.start).replace("前", "前から配信") : "配信中"}`;
  const when = kind === "live" ? ago(x.pub).replace("前", "前に配信") : ago(x.pub);
  return `${esc(x.ch)}<br>${man(x.views)}回視聴・${when}`;
}

function render() {
  document.querySelectorAll("#kind button").forEach(b => b.setAttribute("aria-pressed", b.dataset.kind === kind));
  document.getElementById("tabs").innerHTML = TABS[kind].map(([k, l]) =>
    `<button role="tab" data-tab="${k}" aria-selected="${k === tab}">${l}</button>`).join("");
  document.getElementById("desc").textContent = DESC[`${kind}/${tab}`];
  const all = ((data.lists[kind] || {})[tab]) || [];
  const count = c => all.filter(x => x.cat === c).length;
  const cats = ["すべて", ...[...new Set(all.map(x => x.cat))].sort((a, b) => count(b) - count(a))];
  if (!cats.includes(cat)) cat = "すべて";
  document.getElementById("chips").innerHTML = cats.map(c => `<button aria-pressed="${c === cat}">${esc(c)}</button>`).join("");
  const rows = cat === "すべて" ? all : all.filter(x => x.cat === cat);
  const list = document.getElementById("list");
  if (!rows.length) { list.innerHTML = `<li class="empty">${tab === "now" ? "集計時点で配信中のライブはありません" : "データがまだありません"}</li>`; return; }
  list.innerHTML = rows.map(x => `
    <li><a href="https://www.youtube.com/watch?v=${encodeURIComponent(x.id)}" target="_blank" rel="noopener" data-id="${esc(x.id)}" data-ch="${esc(x.ch)}">
      <div class="rank"><span class="n">${x.rank}</span>${move(x)}</div>
      <div class="thumb"><img loading="lazy" src="https://i.ytimg.com/vi/${encodeURIComponent(x.id)}/mqdefault.jpg" alt="" onerror="this.remove()">${tab === "now" ? '<span class="dur live">● LIVE</span>' : `<span class="dur">${dur(x.dur)}</span>`}</div>
      <div>
        <p class="title">${esc(x.title)}</p>
        <div class="meta"><span class="cat">${esc(x.cat)}</span>${meta(x)}</div>
        <div class="stat">${stat(x)}</div>
      </div>
    </a></li>`).join("");
}

document.getElementById("kind").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.dataset.kind === kind) return;
  kind = b.dataset.kind; tab = TABS[kind][0][0]; cat = "すべて"; save(); render(); window.scrollTo({ top: 0 });
});
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.tab; save(); render(); window.scrollTo({ top: 0 });
});
document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  cat = b.textContent; render();
});
function renderPlay() {
  document.querySelectorAll("#play button").forEach(b => b.setAttribute("aria-pressed", b.dataset.play === play));
}
renderPlay();
document.getElementById("play").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  play = b.dataset.play; renderPlay();
  try { localStorage.setItem("ytjp_play", play); } catch (e) {}
});

const dlg = document.getElementById("player");
function openPlayer(a) {
  const id = a.dataset.id;
  document.getElementById("pv").innerHTML =
    `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&playsinline=1&rel=0" title="YouTube 動画プレーヤー" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  document.getElementById("ptitle").textContent = a.querySelector(".title").textContent;
  document.getElementById("pch").textContent = a.dataset.ch;
  document.getElementById("popen").href = a.href;
  dlg.showModal();
  try { window.goatcounter && window.goatcounter.count && window.goatcounter.count({ path: "play", title: "サイト内再生", event: true }); } catch (e) {}
}
function closePlayer() { if (dlg.open) dlg.close(); }
dlg.addEventListener("close", () => { document.getElementById("pv").innerHTML = ""; });  // 閉じたら再生を止める
dlg.addEventListener("click", e => { if (e.target === dlg) closePlayer(); });
document.getElementById("pclose").addEventListener("click", closePlayer);
document.getElementById("popen").addEventListener("click", closePlayer);
document.getElementById("list").addEventListener("click", e => {
  const a = e.target.closest("a[data-id]");
  if (!a || play !== "site" || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
  e.preventDefault(); openPlayer(a);
});

window.addEventListener("hashchange", () => { if (readHash() && data) render(); });

fetch("data/ranking.json", { cache: "no-store" }).then(r => r.json()).then(d => {
  data = d;
  if (!data.lists.video) data.lists = { video: data.lists, live: {} };  // 旧形式のデータにも対応
  const t = new Date(d.updatedAt * 1000);
  document.getElementById("updated").textContent = t.toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) + " 更新";
  render();
}).catch(() => { document.getElementById("list").innerHTML = '<li class="empty">データを読み込めませんでした</li>'; });
</script>
</body>
</html>
